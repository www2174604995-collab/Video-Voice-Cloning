<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>content.js harness</title>
<style>
  body { margin:0; background:#101014; font-family:system-ui; }
  #player { position:fixed; left:0; top:0; width:100vw; height:100vh; background:radial-gradient(circle at 40% 35%,#1c1c26,#0a0a0e); }
  .title { position:fixed; left:48px; top:44px; color:#3a3a48; font-size:28px; font-weight:800; }
  .bar { position:fixed; left:0; right:0; bottom:0; height:70px; background:linear-gradient(transparent,rgba(0,0,0,.85)); }
</style></head>
<body>
<bwp-video id="player"></bwp-video>
<div class="title">B站播放器（harness）</div>
<div class="bar"></div>
<script>
  // ---- minimal chrome.* stub so content.js can run outside an extension ----
  var listeners = [];
  var sent = [];
  window.chrome = {
    runtime: {
      onMessage: { addListener: function (fn) { listeners.push(fn); } },
      sendMessage: function (msg) { sent.push(msg); return Promise.resolve({ ok: true }); },
      getURL: function (p) { return p; }
    },
    storage: {
      local: {
        get: function (k, cb) { setTimeout(function () { cb({ bilisimul: { target: "en", voice: "clone", orig: 0.12, tts: 1.0, subs: true, server: "ws://127.0.0.1:8765/ws" } }); }, 10); },
        set: function () {}
      }
    }
  };

  // ---- fake video element with the properties content.js reads ----
  var v = document.getElementById("player");
  var state = { t: 0, paused: false, rate: 1 };
  Object.defineProperty(v, "currentTime", { get: function () { return state.t; }, set: function (x) { state.t = x; } });
  Object.defineProperty(v, "paused", { get: function () { return state.paused; } });
  Object.defineProperty(v, "playbackRate", { get: function () { return state.rate; } });

  window.__bspEmit = function (payload) { listeners.forEach(function (fn) { fn(payload); }); };
  window.__bspSent = sent;
  window.__advance = function (t, paused) { state.t = t; if (paused != null) state.paused = paused; };
</script>
<script src="../extension/js/ui.js"></script>
<script src="../extension/js/content.js"></script>
<script>
  setTimeout(function () {
    var emit = window.__bspEmit;
    emit({ to: "content", type: "status", status: "online" });
    emit({ to: "content", type: "started" });
    emit({ to: "content", type: "ready", backends: { asr: "faster_whisper", mt: "llm", tts: "xtts", supports_clone: true } });
    window.__advance(0.2);
    emit({ to: "content", type: "stat", asr: 320, mt: 610, tts: 840, total: 1840, delay: 2.7 });
    emit({ to: "content", type: "subtitle", id: 1, t0: 0.0, t1: 12.0, src: "今天我们来聊一聊这个新版本到底值不值得升级。", dst: "Today we are going to talk about whether this new version is really worth upgrading to.", dub: true });
    // advance like a real player: small steps, never a >1.1s jump (that would be a seek)
    var t = 0;
    setInterval(function () { t += 0.9; window.__advance(t); }, 700);
  }, 1100);
  setTimeout(function () { window.__snap = (window.__bspDebug && window.__bspDebug.subs || []).length; }, 750);
  setTimeout(function () {
    var sh = document.getElementById("bsp-subs-host");
    var box = sh && sh.shadowRoot ? sh.shadowRoot.querySelector(".box") : null;
    if (box) {
      box.style.transition = "none";
      box.style.opacity = "1";
      box.style.transform = "none";
      var d = window.__bspDebug || {};
      document.title = "TXT[" + box.textContent.slice(0, 20) + "] n=" + ((d.subs || []).length) +
        " vid=" + (!!d.video) + " subsOn=" + (d.settings && d.settings.subs) +
        " d=" + d.delay + " shown=" + d.shownId + " mounted=" + d.mounted + " snap=" + window.__snap + " vt=" + d.video.currentTime.toFixed(1);
    } else {
      document.title = sh ? "HOST-NO-BOX" : "NO-HOST";
    }
  }, 3400);
</script>
</body></html>
